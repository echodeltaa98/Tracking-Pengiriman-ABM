<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tracking ABM">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <title>Tracking Pengiriman ABM</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif;background:#f3f5f9}
    .app{height:100%;display:flex;flex-direction:column}
    header{height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#111827;color:#fff;flex:0 0 58px}
    header img{width:34px;height:34px;border-radius:8px}
    header b{font-size:15px}
    header span{font-size:11px;color:#cbd5e1;margin-left:auto}
    main{position:relative;flex:1;min-height:0}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    #install{display:none;position:absolute;right:12px;bottom:12px;border:0;border-radius:12px;padding:11px 14px;background:#2563eb;color:#fff;font-weight:800;box-shadow:0 8px 25px #0003;z-index:5}
    #install.show{display:block}
    #error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;background:#f3f5f9}
    #error.show{display:flex}
    .box{max-width:520px;background:#fff;border:1px solid #dbe1ea;border-radius:16px;padding:22px}
    .box h2{margin:0 0 8px}
    .box p{color:#64748b;line-height:1.5}
    .box code{display:block;word-break:break-all;background:#f1f5f9;padding:10px;border-radius:8px}
  </style>
</head>
<body>
<div class="app">
  <header>
    <img src="./icon-192.png" alt="ABM">
    <b>Tracking Pengiriman ABM</b>
    <span>PWA</span>
  </header>
  <main>
    <iframe id="appFrame" title="Tracking Pengiriman ABM"
      allow="clipboard-read; clipboard-write"></iframe>
    <button id="install">＋ Install Aplikasi</button>
    <div id="error">
      <div class="box">
        <h2>URL Web App belum diatur</h2>
        <p>Buka file <b>index.html</b> dan isi konstanta <b>GAS_URL</b> dengan URL Web App V6 Anda.</p>
        <code>https://script.google.com/macros/s/DEPLOYMENT_ID/exec</code>
      </div>
    </div>
  </main>
</div>

<script>
  // GANTI nilai ini dengan URL Web App V6 Anda.
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbz113GmLkaZvKbncgXkNj9hL8cQJCSCjXscK_XTyHqjUApkk561Arhf3pPFqgBonl_RLCwQnQbUg/exec';

  const frame = document.getElementById('appFrame');
  const error = document.getElementById('error');

  if (GAS_URL.startsWith('http')) {
    frame.src = GAS_URL;
  } else {
    error.classList.add('show');
  }

  // PWA service worker: hanya menangani shell PWA, bukan Google Apps Script.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    });
  }

  let deferredPrompt;
  const installBtn = document.getElementById('install');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('show');
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.classList.remove('show');
  });

  window.addEventListener('appinstalled', () => {
    installBtn.classList.remove('show');
  });
</script>
</body>
</html>
